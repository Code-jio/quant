name: Offline quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QUANT_ENV: test
      QUANT_ALLOW_SYNTHETIC_DATA: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back_end/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front_end/package-lock.json
      - run: python -m pip install -r back_end/requirements-dev.lock
      - run: python scripts/check_secrets.py
      - name: Backend static checks and tests
        working-directory: back_end
        run: |
          python -m ruff check main.py server.py src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage run --source=src -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage report --fail-under=60
      - run: npm ci
        working-directory: front_end
      - run: npm run quality
        working-directory: front_end
      - run: node scripts/check_bundle.mjs
      - run: npm audit --audit-level=high
        working-directory: front_end
      - run: npx playwright install chromium
        working-directory: front_end
      - run: npm run e2e
        working-directory: front_end
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: front_end/test-results
